<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiritual Results — Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: #FAF7EE;
      font-family: 'Inter', sans-serif;
      color: #2A2218;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.7;
    }
    ::selection { background: rgba(139,106,31,0.15); }
    button { font-family: inherit; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid rgba(139,106,31,0.45);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Sage pulse animation for shrine guest indicator */
    @keyframes sagePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(94,113,72,0.35); }
      50% { box-shadow: 0 0 0 5px rgba(94,113,72,0); }
    }
    .sage-pulse { animation: sagePulse 2.4s ease-in-out infinite; }

    /* Greeting phrase fade-in */
    @keyframes fadeInPhrase {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* AdaptGent loading dots */
    @keyframes agDots {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .ag-dots { animation: agDots 1.2s ease-in-out infinite; }

    /* Responsive: hide nav links on mobile */
    @media (max-width: 640px) {
      .db-nav-links { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks panel -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Dashboard components -->
  <script type="text/babel" src="sr-dashboard.jsx"></script>

  <!-- AdaptGent floating helper -->
  <script type="text/babel" src="sr-adaptgent.jsx"></script>

  <!-- Mount -->
  <script type="text/babel">
    const DB_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "timeOverride": "auto",
      "showGuestPresence": true,
      "spacing": "spacious"
    }/*EDITMODE-END*/;
    window.DB_TWEAK_DEFAULTS = DB_TWEAK_DEFAULTS;

    function App() {
      return (
        <>
          <Dashboard />
          <AdaptGent />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
